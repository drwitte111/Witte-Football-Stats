<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NFL Stats">
  <meta name="theme-color" content="#000000">
  <title>Witte Football Stats</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <header class="top">
    <div class="title-row">
      <div class="titles">
        <div class="eyebrow" id="eyebrow">Fantasy Leaders</div>
        <h1 id="title">Leaders</h1>
      </div>
      <button id="watch" class="icon-btn" type="button" aria-label="Multiview">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M3 4h8v7H3zM13 4h8v7h-8zM3 13h8v7H3zM13 13h8v7h-8z"/>
        </svg>
      </button>
      <button id="settings" class="icon-btn" type="button" aria-label="Fantasy scoring settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94a7.1 7.1 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54a7 7 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.68 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.1 7.1 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
        </svg>
      </button>
      <button id="refresh" class="icon-btn accent" type="button" aria-label="Refresh from ESPN">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>
    <div class="pickers">
      <label class="chip">
        <select id="season" aria-label="Season"></select>
        <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </label>
      <label class="chip grow">
        <select id="week" aria-label="Week"></select>
        <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </label>
    </div>
    <div class="status" id="status"></div>
  </header>

  <main id="list" class="list"></main>

  <nav class="tabs" id="tabs" role="tablist">
    <span class="tab-pill" aria-hidden="true"></span>
    <button type="button" role="tab" data-pos="QB" class="active">QB</button>
    <button type="button" role="tab" data-pos="RB">RB</button>
    <button type="button" role="tab" data-pos="WR">WR</button>
    <button type="button" role="tab" data-pos="TE">TE</button>
  </nav>

  <section id="multiview" class="mv" hidden>
    <div class="mv-bar">
      <button type="button" class="mv-clear-all">Clear all</button>
      <div class="mv-stepper">
        <button type="button" data-step="-1" aria-label="Fewer boxes">−</button>
        <span class="mv-count">4 boxes</span>
        <button type="button" data-step="1" aria-label="More boxes">+</button>
      </div>
      <button type="button" class="mv-done">Done</button>
    </div>
    <div class="mv-grid"></div>
  </section>

  <script src="app.js?v=10"></script>
  <script src="multiview.js?v=10"></script>
</body>
</html>
